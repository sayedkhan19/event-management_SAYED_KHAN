
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            text-align: center;
            padding: 80px 20px;
            color: #1f2937;
        }

        .success-card {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 50px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .success {
            color: #15803d;
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="success">
            Registration Successful!
        </div>

        <p>
            You have successfully registered for
            <strong>{{ event.title }}</strong>.
        </p>

        <a href="{% url 'event_list' %}">
            Back to Events
        </a>

    </div>

</body>
</html>
