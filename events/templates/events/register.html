<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | {{ event.title }}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #1f4e79;
            color: white;
            padding: 20px 8%;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .event-name {
            color: #1f4e79;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e79;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #1f4e79;
            text-decoration: none;
        }
         .error-message {
    background: #fee2e2;
    color: #b91c1c;
    padding: 12px 15px;
    border-radius: 6px;
    margin-bottom: 20px;
    border: 1px solid #fecaca;
}
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="{% url 'event_list' %}">Event Management</a>
    </nav>

    <div class="container">

        <div class="form-card">

            <h1>Register for Event</h1>

            <p class="event-name">
                {{ event.title }}
            </p>
             
             {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
{% endif %}
            <form method="POST">
                {% csrf_token %}

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Phone</label>
                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

                <button type="submit">
                    Register Now
                </button>
            </form>

            <a href="{% url 'event_detail' event.id %}" class="back">
                ← Back to Event
            </a>

        </div>

    </div>

</body>
</html>
