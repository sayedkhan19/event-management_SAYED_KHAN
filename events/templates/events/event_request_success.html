<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Submitted</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
        }

        .success-card {
            background: white;
            padding: 45px 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 15px;
            color: #16a34a;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success-card">

        <div class="success-icon">✓</div>

        <h1>Request Submitted Successfully!</h1>

        <p>
            Thank you for your event request.
            Our management team will review your request
            and contact you soon.
        </p>

        <a href="{% url 'event_list' %}" class="back-btn">
            ← Back to Events
        </a>

    </div>

</div>

</body>
</html>
